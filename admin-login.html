<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | RajEdge</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #071a3d, #123f78);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #0b2a5b;
            font-size: 32px;
        }

        .logo h1 span {
            color: #f5b400;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #0b2a5b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #123f78;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #0b2a5b;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h1>Raj<span>Edge</span></h1>
        <p>Admin Panel</p>
    </div>

    <h2>🔐 Admin Login</h2>

    <div id="message"></div>

    <form id="adminLoginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit" id="loginBtn">
            Login to Admin Panel
        </button>

    </form>

    <div class="back">
        <a href="index.html">← Back to Website</a>
    </div>

</div>

<script>

const SUPABASE_URL = "https://xysgwtnclxpacmlgnmer.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5VnfiKCfqI0s_dTO3B5CPg_OekspHI5";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document
.getElementById("adminLoginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    const loginBtn =
        document.getElementById("loginBtn");

    message.textContent = "";
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            throw error;
        }

        if (!data.user) {
            throw new Error("Admin login failed.");
        }

        message.style.color = "green";
        message.textContent =
            "✅ Login successful!";

        setTimeout(() => {
            window.location.href =
                "admin-dashboard.html";
        }, 700);

    } catch (error) {

        message.style.color = "red";
        message.textContent =
            "❌ " + error.message;

        loginBtn.disabled = false;
        loginBtn.textContent =
            "Login to Admin Panel";
    }

});

</script>

</body>
</html>
