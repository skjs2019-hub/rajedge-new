<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Courses | RajEdge</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .courses-page {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .courses-header {
            background: #052a5b;
            color: white;
            padding: 18px 25px;
        }

        .courses-header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            font-size: 30px;
        }

        .brand h1 {
            margin: 0;
            font-size: 23px;
        }

        .brand p {
            margin: 2px 0 0;
            font-size: 12px;
            opacity: .8;
        }

        .back-btn {
            color: #052a5b;
            background: #f5c400;
            padding: 9px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        .courses-container {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #052a5b;
            margin: 0 0 7px;
        }

        .page-title p {
            color: #777;
            margin: 0;
        }

        .course-form-card,
        .courses-list {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .06);
            margin-bottom: 25px;
        }

        .course-form-card h3,
        .courses-list h3 {
            margin-top: 0;
            color: #052a5b;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0755a5;
            box-shadow: 0 0 0 3px rgba(7, 85, 165, .08);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .course-btn {
            background: #052a5b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
        }

        .course-btn:hover {
            background: #0b4b88;
        }

        .course-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #e9edf2;
            color: #333;
            margin-left: 8px;
        }

        .clear-btn:hover {
            background: #dce2e8;
        }

        .edit-mode {
            background: #fff8dc;
            border: 1px solid #f5c400;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .courses-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        .courses-table th,
        .courses-table td {
            padding: 14px 10px;
            border-bottom: 1px solid #edf0f4;
            text-align: left;
        }

        .courses-table th {
            color: #666;
            font-size: 13px;
            background: #fafbfd;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-active {
            background: #e7f7ed;
            color: #16803c;
        }

        .status-inactive {
            background: #ffeaea;
            color: #c62828;
        }

        .action-btn {
            border: none;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 4px;
        }

        .edit-btn {
            background: #e8f1ff;
            color: #0755a5;
        }

        .delete-btn {
            background: #ffe8e8;
            color: #c62828;
        }

        .empty-row {
            text-align: center !important;
            color: #888;
            padding: 30px !important;
        }

        .course-count {
            display: inline-block;
            background: #e8f1ff;
            color: #0755a5;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-left: 8px;
        }

        .loading {
            text-align: center !important;
            padding: 30px !important;
            color: #666;
        }

        .message {
            padding: 12px 15px;
            border-radius: 9px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        .success-message {
            background: #e7f7ed;
            color: #16803c;
        }

        .error-message {
            background: #ffeaea;
            color: #c62828;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .courses-header {
                padding: 15px;
            }

            .courses-header-inner {
                gap: 15px;
            }

            .brand h1 {
                font-size: 19px;
            }

            .back-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .courses-container {
                padding: 20px 12px;
            }

            .course-form-card,
            .courses-list {
                padding: 18px;
            }
        }
    </style>

</head>

<body>

<div class="courses-page">

    <!-- HEADER -->
    <header class="courses-header">

        <div class="courses-header-inner">

            <div class="brand">

                <div class="brand-icon">
                    📚
                </div>

                <div>

                    <h1>
                        RajEdge Admin
                    </h1>

                    <p>
                        Course Management
                    </p>

                </div>

            </div>

            <a href="admin-dashboard.html" class="back-btn">
                ← Dashboard
            </a>

        </div>

    </header>


    <main class="courses-container">

        <div class="page-title">

            <h2>
                📚 Manage Courses
            </h2>

            <p>
                Courses और pricing manage करें।
            </p>

        </div>


        <!-- MESSAGE -->
        <div id="messageBox" class="message"></div>


        <!-- ADD / EDIT COURSE -->
        <section class="course-form-card" id="courseFormCard">

            <h3 id="formTitle">
                ➕ Add New Course
            </h3>


            <form id="courseForm">

                <div class="form-grid">

                    <!-- COURSE NAME -->
                    <div class="form-group">

                        <label for="courseName">
                            Course Name
                        </label>

                        <input
                            type="text"
                            id="courseName"
                            placeholder="जैसे REET"
                            required
                        >

                    </div>


                    <!-- SLUG -->
                    <div class="form-group">

                        <label for="courseSlug">
                            Slug
                        </label>

                        <input
                            type="text"
                            id="courseSlug"
                            placeholder="reet"
                            required
                        >

                    </div>


                    <!-- NOTES PRICE -->
                    <div class="form-group">

                        <label for="notesPrice">
                            Notes Price (₹)
                        </label>

                        <input
                            type="number"
                            id="notesPrice"
                            value="99"
                            min="0"
                            required
                        >

                    </div>


                    <!-- TEST SERIES PRICE -->
                    <div class="form-group">

                        <label for="testSeriesPrice">
                            Test Series Price (₹)
                        </label>

                        <input
                            type="number"
                            id="testSeriesPrice"
                            value="39"
                            min="0"
                            required
                        >

                    </div>


                    <!-- STATUS -->
                    <div class="form-group">

                        <label for="courseStatus">
                            Status
                        </label>

                        <select id="courseStatus">

                            <option value="true">
                                Active
                            </option>

                            <option value="false">
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>


                <br>


                <button
                    type="submit"
                    class="course-btn"
                    id="submitBtn"
                >
                    + Add Course
                </button>


                <button
                    type="button"
                    class="course-btn clear-btn"
                    onclick="clearForm()"
                >
                    Clear
                </button>

            </form>

        </section>


        <!-- COURSE LIST -->
        <section class="courses-list">

            <h3>

                📋 All Courses

                <span
                    class="course-count"
                    id="courseCount"
                >
                    0 Courses
                </span>

            </h3>


            <div class="table-wrapper">

                <table class="courses-table">

                    <thead>

                        <tr>

                            <th>Course</th>
                            <th>Slug</th>
                            <th>Notes Price</th>
                            <th>Test Series</th>
                            <th>Status</th>
                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="courseTableBody">

                        <tr>

                            <td
                                colspan="6"
                                class="loading"
                            >
                                Courses loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script>

/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://xysgwtnclxpacmlgnmer.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5VnfiKCfqI0s_dTO3B5CPg_OekspHI5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let editingCourseId = null;


/* =========================================
   ADMIN ACCESS CHECK
========================================= */

async function checkAdminAccess() {

    try {

        /* CHECK LOGIN */

        const {
            data: userData,
            error: userError
        } = await supabaseClient.auth.getUser();


        if (userError || !userData.user) {

            window.location.replace(
                "admin-login.html"
            );

            return;
        }


        const user =
            userData.user;


        /* CHECK ADMIN ROLE */

        const {
            data: adminData,
            error: adminError
        } = await supabaseClient
            .from("admin_users")
            .select("id,email")
            .eq("id", user.id)
            .maybeSingle();


        if (adminError) {

            console.error(
                "Admin verification error:",
                adminError
            );

            alert(
                "Admin verification failed."
            );

            await supabaseClient.auth.signOut();

            window.location.replace(
                "admin-login.html"
            );

            return;
        }


        /* NOT ADMIN */

        if (!adminData) {

            alert(
                "⛔ आपको Admin access नहीं है।"
            );

            await supabaseClient.auth.signOut();

            window.location.replace(
                "student-dashboard.html"
            );

            return;
        }


        /* ADMIN VERIFIED */

        console.log(
            "✅ Admin verified:",
            adminData.email
        );


        /* NOW LOAD PAGE DATA */

        loadCourses();

        setupSlug();

    }

    catch (error) {

        console.error(
            "Admin access error:",
            error
        );

        window.location.replace(
            "admin-login.html"
        );

    }

}


/* =========================================
   PAGE LOAD
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        checkAdminAccess();

    }
);


/* =========================================
   LOAD COURSES
========================================= */

async function loadCourses() {

    const tbody =
        document.getElementById(
            "courseTableBody"
        );


    tbody.innerHTML = `
        <tr>
            <td colspan="6" class="loading">
                Courses loading...
            </td>
        </tr>
    `;


    const {
        data,
        error
    } = await supabaseClient
        .from("courses")
        .select(
            "id,name,slug,notes_price,test_series_price,is_active,created_at"
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Supabase Error:",
            error
        );


        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty-row">

                    ❌ Courses load नहीं हो पाए।

                    <br><br>

                    ${escapeHTML(error.message)}

                </td>
            </tr>
        `;


        showMessage(
            "Courses load error: " +
            error.message,
            "error"
        );

        return;
    }


    tbody.innerHTML = "";


    if (!data || data.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="empty-row">
                    अभी कोई course नहीं है।
                </td>
            </tr>
        `;


        updateCourseCount(0);

        return;
    }


    data.forEach(
        course => {

            addCourseRow(course);

        }
    );


    updateCourseCount(
        data.length
    );

}


/* =========================================
   ADD COURSE ROW
========================================= */

function addCourseRow(course) {

    const tbody =
        document.getElementById(
            "courseTableBody"
        );


    const row =
        document.createElement("tr");


    row.dataset.id =
        course.id;


    const statusText =
        course.is_active
            ? "Active"
            : "Inactive";


    const statusClass =
        course.is_active
            ? "status-active"
            : "status-inactive";


    row.innerHTML = `

        <td>

            <strong>
                ${escapeHTML(course.name)}
            </strong>

        </td>


        <td>
            ${escapeHTML(course.slug)}
        </td>


        <td>
            ₹${Number(course.notes_price || 0)}
        </td>


        <td>
            ₹${Number(course.test_series_price || 0)}
        </td>


        <td>

            <span class="status ${statusClass}">
                ${statusText}
            </span>

        </td>


        <td>

            <button
                class="action-btn edit-btn"
                onclick="editCourse('${course.id}')"
            >
                Edit
            </button>


            <button
                class="action-btn delete-btn"
                onclick="deleteCourse('${course.id}', '${escapeForJS(course.name)}')"
            >
                Delete
            </button>

        </td>

    `;


    tbody.appendChild(row);

}


/* =========================================
   ADD / UPDATE COURSE
========================================= */

document
    .getElementById("courseForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("courseName")
                    .value
                    .trim();


            const slug =
                document
                    .getElementById("courseSlug")
                    .value
                    .trim()
                    .toLowerCase();


            const notesPrice =
                Number(
                    document
                        .getElementById("notesPrice")
                        .value
                );


            const testSeriesPrice =
                Number(
                    document
                        .getElementById("testSeriesPrice")
                        .value
                );


            const isActive =
                document
                    .getElementById("courseStatus")
                    .value === "true";


            if (
                !name ||
                !slug ||
                isNaN(notesPrice) ||
                isNaN(testSeriesPrice)
            ) {

                showMessage(
                    "Please fill all required fields.",
                    "error"
                );

                return;
            }


            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );


            submitBtn.disabled = true;


            submitBtn.innerText =
                editingCourseId
                    ? "Updating..."
                    : "Saving...";


            /* UPDATE */

            if (editingCourseId) {

                const {
                    error
                } = await supabaseClient
                    .from("courses")
                    .update({

                        name: name,

                        slug: slug,

                        notes_price:
                            notesPrice,

                        test_series_price:
                            testSeriesPrice,

                        is_active:
                            isActive

                    })
                    .eq(
                        "id",
                        editingCourseId
                    );


                submitBtn.disabled = false;


                if (error) {

                    console.error(error);

                    showMessage(
                        "Update failed: " +
                        error.message,
                        "error"
                    );

                    submitBtn.innerText =
                        "Update Course";

                    return;
                }


                showMessage(
                    "✅ Course updated successfully.",
                    "success"
                );


                clearForm();

                await loadCourses();

                return;
            }


            /* INSERT */

            const {
                data,
                error
            } = await supabaseClient
                .from("courses")
                .insert({

                    name: name,

                    slug: slug,

                    notes_price:
                        notesPrice,

                    test_series_price:
                        testSeriesPrice,

                    is_active:
                        isActive

                })
                .select()
                .single();


            submitBtn.disabled = false;


            if (error) {

                console.error(error);

                showMessage(
                    "Course save failed: " +
                    error.message,
                    "error"
                );

                submitBtn.innerText =
                    "+ Add Course";

                return;
            }


            showMessage(
                "✅ Course added successfully.",
                "success"
            );


            clearForm();

            await loadCourses();

        }
    );


/* =========================================
   EDIT COURSE
========================================= */

async function editCourse(id) {

    const {
        data,
        error
    } = await supabaseClient
        .from("courses")
        .select(
            "id,name,slug,notes_price,test_series_price,is_active"
        )
        .eq(
            "id",
            id
        )
        .single();


    if (error) {

        showMessage(
            "Course load failed: " +
            error.message,
            "error"
        );

        return;
    }


    editingCourseId =
        data.id;


    document.getElementById(
        "courseName"
    ).value =
        data.name;


    document.getElementById(
        "courseSlug"
    ).value =
        data.slug;


    document.getElementById(
        "notesPrice"
    ).value =
        data.notes_price;


    document.getElementById(
        "testSeriesPrice"
    ).value =
        data.test_series_price;


    document.getElementById(
        "courseStatus"
    ).value =
        data.is_active
            ? "true"
            : "false";


    document.getElementById(
        "formTitle"
    ).innerText =
        "✏️ Edit Course";


    document.getElementById(
        "submitBtn"
    ).innerText =
        "Update Course";


    document.getElementById(
        "courseFormCard"
    ).classList.add(
        "edit-mode"
    );


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================
   DELETE COURSE
========================================= */

async function deleteCourse(
    id,
    courseName
) {

    const confirmDelete =
        confirm(
            "क्या आप " +
            courseName +
            " course delete करना चाहते हैं?"
        );


    if (!confirmDelete) {
        return;
    }


    const {
        error
    } = await supabaseClient
        .from("courses")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        showMessage(
            "Delete failed: " +
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        "🗑️ " +
        courseName +
        " deleted successfully.",
        "success"
    );


    await loadCourses();

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm() {

    document
        .getElementById("courseForm")
        .reset();


    document.getElementById(
        "notesPrice"
    ).value = 99;


    document.getElementById(
        "testSeriesPrice"
    ).value = 39;


    editingCourseId =
        null;


    document.getElementById(
        "formTitle"
    ).innerText =
        "➕ Add New Course";


    document.getElementById(
        "submitBtn"
    ).innerText =
        "+ Add Course";


    document.getElementById(
        "courseFormCard"
    ).classList.remove(
        "edit-mode"
    );

}


/* =========================================
   AUTO SLUG
========================================= */

function setupSlug() {

    const nameInput =
        document.getElementById(
            "courseName"
        );


    const slugInput =
        document.getElementById(
            "courseSlug"
        );


    nameInput.addEventListener(
        "input",
        function() {

            if (editingCourseId) {
                return;
            }


            slugInput.value =
                nameInput.value
                    .toLowerCase()
                    .trim()
                    .replace(
                        /[^a-z0-9]+/g,
                        "-"
                    )
                    .replace(
                        /^-+|-+$/g,
                        ""
                    );

        }
    );

}


/* =========================================
   COURSE COUNT
========================================= */

function updateCourseCount(count) {

    document.getElementById(
        "courseCount"
    ).innerText =
        count +
        (
            count === 1
                ? " Course"
                : " Courses"
        );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
    message,
    type
) {

    const box =
        document.getElementById(
            "messageBox"
        );


    box.innerText =
        message;


    box.className =
        "message " +
        (
            type === "success"
                ? "success-message"
                : "error-message"
        );


    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        5000
    );

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   JS STRING ESCAPE
========================================= */

function escapeForJS(value) {

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        );

}

</script>

</body>

</html>
