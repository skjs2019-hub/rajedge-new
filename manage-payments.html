<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Requests - RajEdge Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #facc15;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 18px;
        }

        .top-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }

        .top-box h1 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 18px;
        }

        .stat {
            padding: 18px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .stat h3 {
            font-size: 28px;
            margin-top: 5px;
        }

        .pending {
            color: #d97706;
        }

        .approved {
            color: #16a34a;
        }

        .rejected {
            color: #dc2626;
        }

        .filter-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 18px;
        }

        select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            width: 200px;
        }

        .request-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
            border-left: 5px solid #f59e0b;
        }

        .request-card.approved-card {
            border-left-color: #22c55e;
        }

        .request-card.rejected-card {
            border-left-color: #ef4444;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .request-header h3 {
            color: #0f172a;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.pending {
            background: #fef3c7;
        }

        .badge.approved {
            background: #dcfce7;
        }

        .badge.rejected {
            background: #fee2e2;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;

        }

        .detail {
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;

        .detail small {

        .approve-btn {

        }

        .reject-btn {

        }

        .refresh-btn {
            background: #2563eb;

            margin-left: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .empty {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 14px;
            color: #64748b;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .note {
            margin-top: 10px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            color: #475569;
        }

        .status-box {
            margin-bottom: 20px;

        }

        @media (max-width: 768px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .request-header {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>RajEdge Admin</h2>

    <a
        href="admin-dashboard.html"
        class="back-btn">
        ← Dashboard
    </a>
</header>


<div class="container">

    <div class="top-box">

        <h1>💳 Payment Requests</h1>

        <p>
            Students द्वारा भेजी गई payment requests यहाँ verify करें।
        </p>

        <div class="stats">

            <div class="stat">
                <div>Pending</div>
                <h3
                    id="pendingCount"
                    class="pending">
                    0
                </h3>
            </div>

            <div class="stat">
                <div>Approved</div>
                <h3
                    id="approvedCount"
                    class="approved">
                    0
                </h3>
            </div>

            <div class="stat">
                <div>Rejected</div>
                <h3
                    id="rejectedCount"
                    class="rejected">
                    0
                </h3>
            </div>

        </div>

    </div>


    <div
        id="statusBox"
        class="status-box">
    </div>


    <div class="filter-box">

        <select
            id="statusFilter"
            onchange="loadPayments()">

            <option value="all">
                All Requests
            </option>

            <option value="pending">
                Pending
            </option>

            <option value="approved">
                Approved
            </option>

            <option value="rejected">
                Rejected
            </option>

        </select>


        <button
            class="refresh-btn"
            onclick="loadPayments()">

            🔄 Refresh

        </button>

    </div>


    <div id="paymentList">

        <div class="loading">
            Loading payment requests...
        </div>

    </div>

</div>


<script>

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
    "https://xysgwtnclxpacmlgnmer.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5VnfiKCfqI0s_dTO3B5CPg_OekspHI5";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let allPayments = [];


/* ===============================
   STATUS MESSAGE
================================ */

function showStatus(message) {

    const box =
        document.getElementById(
            "statusBox"
        );

    box.style.display = "block";

    box.innerHTML =
        message;
}


/* ===============================
   ADMIN CHECK
================================ */

async function checkAdmin() {

    console.log(
        "Checking admin..."
    );


    const {
        data,
        error
    } =
        await supabaseClient.auth.getUser();


    console.log(
        "USER:",
        data?.user
    );


    console.log(
        "USER ERROR:",
        error
    );


    if (error || !data?.user) {

        alert(
            "❌ Admin login required."
        );

        window.location.href =
            "admin-login.html";

        return false;
    }


    const user =
        data.user;


    const {
        data: admin,
        error: adminError
    } =
        await supabaseClient
            .from("admin_users")
            .select("id, email")
            .eq(
                "id",
                user.id
            )
            .maybeSingle();


    console.log(
        "ADMIN RECORD:",
        admin
    );


    console.log(
        "ADMIN ERROR:",
        adminError
    );


    if (
        adminError ||
        !admin
    ) {

        alert(
            "❌ Access denied.\n\n" +
            "This account is not an admin."
        );

        window.location.href =
            "student-dashboard.html";

        return false;
    }


    console.log(
        "ADMIN VERIFIED:",
        admin.email
    );


    return true;
}


/* ===============================
   LOAD PAYMENTS
================================ */

async function loadPayments() {

    const list =
        document.getElementById(
            "paymentList"
        );


    list.innerHTML =
        `<div class="loading">
            Loading payment requests...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("payment_requests")
            .select(`
                id,
                student_id,
                course_id,
                purchase_type,
                amount,
                utr_number,
                payment_status,
                admin_note,
                created_at,
                verified_at
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "PAYMENT LOAD ERROR:",
            error
        );


        list.innerHTML =
            `<div class="empty">
                ❌ Payment requests load नहीं हो पाईं.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>`;


        return;
    }


    allPayments =
        data || [];


    await addStudentAndCourseInfo();


    updateStats();


    renderPayments();
}


/* ===============================
   STUDENT + COURSE INFO
================================ */

async function addStudentAndCourseInfo() {

    const studentIds =
        [
            ...new Set(
                allPayments
                    .map(
                        p =>
                            p.student_id
                    )
                    .filter(Boolean)
            )
        ];


    const courseIds =
        [
            ...new Set(
                allPayments
                    .map(
                        p =>
                            p.course_id
                    )
                    .filter(Boolean)
            )
        ];


    let students = [];

    let courses = [];


    if (studentIds.length) {

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    "student_profiles"
                )
                .select(
                    "id, full_name, mobile, email, login_email"
                )
                .in(
                    "id",
                    studentIds
                );


        if (error) {

            console.error(
                "STUDENT ERROR:",
                error
            );
        }


        students =
            data || [];
    }


    if (courseIds.length) {

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    "courses"
                )
                .select(
                    "id, name"
                )
                .in(
                    "id",
                    courseIds
                );


        if (error) {

            console.error(
                "COURSE ERROR:",
                error
            );
        }


        courses =
            data || [];
    }


    allPayments =
        allPayments.map(
            payment => {

                const student =
                    students.find(
                        s =>
                            s.id ===
                            payment.student_id
                    );


                const course =
                    courses.find(
                        c =>
                            c.id ===
                            payment.course_id
                    );


                return {

                    ...payment,

                    studentName:
                        student?.full_name ||
                        "Unknown Student",

                    studentMobile:
                        student?.mobile ||
                        "-",

                    studentEmail:
                        student?.email ||
                        student?.login_email ||
                        "-",

                    courseName:
                        course?.name ||
                        "Unknown Course"

                };

            }
        );
}


/* ===============================
   STATS
================================ */

function updateStats() {

    const pending =
        allPayments.filter(
            p =>
                p.payment_status ===
                "pending"
        ).length;


    const approved =
        allPayments.filter(
            p =>
                p.payment_status ===
                "approved"
        ).length;


    const rejected =
        allPayments.filter(
            p =>
                p.payment_status ===
                "rejected"
        ).length;


    document.getElementById(
        "pendingCount"
    ).textContent =
        pending;


    document.getElementById(
        "approvedCount"
    ).textContent =
        approved;


    document.getElementById(
        "rejectedCount"
    ).textContent =
        rejected;
}


/* ===============================
   RENDER
================================ */

function renderPayments() {

    const list =
        document.getElementById(
            "paymentList"
        );


    const filter =
        document.getElementById(
            "statusFilter"
        ).value;


    let payments =
        allPayments;


    if (
        filter !== "all"
    ) {

        payments =
            payments.filter(
                p =>
                    p.payment_status ===
                    filter
            );
    }


    if (
        !payments.length
    ) {

        list.innerHTML =
            `<div class="empty">
                📭 No payment requests found.
            </div>`;

        return;
    }


    list.innerHTML =
        payments.map(
            payment => {

                const status =
                    payment.payment_status ||
                    "pending";


                const cardClass =
                    status === "approved"
                        ? "approved-card"
                        : status === "rejected"
                            ? "rejected-card"
                            : "";


                const date =
                    new Date(
                        payment.created_at
                    ).toLocaleString(
                        "en-IN"
                    );


                let actions = "";


                if (
                    status === "pending"
                ) {

                    actions = `

                        <div class="actions">

                            <button
                                class="approve-btn"
                                onclick="approvePayment(${payment.id})">

                                ✅ Approve Payment

                            </button>


                            <button
                                class="reject-btn"
                                onclick="rejectPayment(${payment.id})">

                                ❌ Reject

                            </button>

                        </div>

                    `;
                }


                return `

                    <div
                        class="request-card ${cardClass}">

                        <div
                            class="request-header">

                            <div>

                                <h3>
                                    ${escapeHtml(
                                        payment.studentName
                                    )}
                                </h3>

                                <small>
                                    Request ID:
                                    #${payment.id}
                                </small>

                            </div>


                            <span
                                class="badge ${status}">

                                ${status.toUpperCase()}

                            </span>

                        </div>


                        <div class="details">

                            <div class="detail">

                                <small>
                                    📱 Mobile
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        payment.studentMobile
                                    )}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    📧 Email
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        payment.studentEmail
                                    )}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    📚 Course
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        payment.courseName
                                    )}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    💰 Amount
                                </small>

                                <strong>
                                    ₹${Number(
                                        payment.amount || 0
                                    ).toFixed(2)}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    🔑 UTR / Transaction ID
                                </small>

                                <strong>
                                    ${escapeHtml(
                                        payment.utr_number
                                    )}
                                </strong>

                            </div>


                            <div class="detail">

                                <small>
                                    🕒 Request Date
                                </small>

                                <strong>
                                    ${date}
                                </strong>

                            </div>

                        </div>


                        ${
                            payment.admin_note
                                ?
                                `<div class="note">
                                    📝 Admin Note:
                                    ${escapeHtml(
                                        payment.admin_note
                                    )}
                                </div>`
                                :
                                ""
                        }


                        ${
                            payment.verified_at
                                ?
                                `<div class="note">
                                    ✔ Verified:
                                    ${new Date(
                                        payment.verified_at
                                    ).toLocaleString(
                                        "en-IN"
                                    )}
                                </div>`
                                :
                                ""
                        }


                        ${actions}

                    </div>

                `;
            }
        ).join("");
}


/* =================================================
   APPROVE PAYMENT
================================================= */

async function approvePayment(id) {

    console.log(
        "STEP 1 - APPROVE CLICKED:",
        id
    );


    const payment =
        allPayments.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if (!payment) {

        alert(
            "❌ Payment request नहीं मिली."
        );

        return;
    }


    /* -----------------------------------------
       CONFIRM
    ----------------------------------------- */

    const confirmApprove =
        window.confirm(

            "Payment approve करें?\n\n" +

            "Student: " +
            payment.studentName +

            "\nCourse: " +
            payment.courseName +

            "\nAmount: ₹" +
            payment.amount +

            "\nUTR: " +
            payment.utr_number
        );


    if (!confirmApprove) {

        console.log(
            "STEP 2 - ADMIN CANCELLED"
        );

        return;
    }


    console.log(
        "STEP 3 - CONFIRM OK"
    );


    alert(
        "⏳ Approval process शुरू हो रहा है..."
    );


    /* -----------------------------------------
       SESSION
    ----------------------------------------- */

    console.log(
        "STEP 4 - CHECKING SESSION"
    );


    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient
            .auth
            .getSession();


    console.log(
        "SESSION:",
        sessionData
    );


    console.log(
        "SESSION ERROR:",
        sessionError
    );


    if (
        sessionError ||
        !sessionData?.session
    ) {

        alert(
            "❌ Admin session नहीं मिली.\n\n" +
            "Admin Logout करके फिर से Login करें."
        );

        return;
    }


    const currentUser =
        sessionData.session.user;


    console.log(
        "STEP 5 - USER ID:",
        currentUser.id
    );


    /* -----------------------------------------
       ADMIN VERIFY
    ----------------------------------------- */

    const {
        data: adminCheck,
        error: adminCheckError
    } =
        await supabaseClient
            .from("admin_users")
            .select(
                "id, email"
            )
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


    console.log(
        "ADMIN CHECK:",
        adminCheck
    );


    console.log(
        "ADMIN CHECK ERROR:",
        adminCheckError
    );


    if (
        adminCheckError ||
        !adminCheck
    ) {

        alert(
            "❌ Current account admin_users में नहीं मिला."
        );

        return;
    }


    console.log(
        "STEP 6 - ADMIN VERIFIED:",
        adminCheck.email
    );


    alert(
        "✅ Admin verified.\n\n" +
        "अब payment database में approve की जा रही है..."
    );


    /* -----------------------------------------
       RPC
    ----------------------------------------- */

    console.log(
        "STEP 7 - CALLING RPC"
    );


    const {
        data,
        error
    } =
        await supabaseClient
            .rpc(
                "approve_payment_request",
                {
                    request_id:
                        Number(id),

                    note_text:
                        "Payment verified and approved."
                }
            );


    console.log(
        "STEP 8 - RPC DATA:",
        data
    );


    console.log(
        "STEP 8 - RPC ERROR:",
        error
    );


    /* -----------------------------------------
       RPC ERROR
    ----------------------------------------- */

    if (error) {

        console.error(
            "APPROVE RPC ERROR:",
            error
        );


        alert(

            "❌ APPROVAL FAILED\n\n" +

            "Message:\n" +
            (
                error.message ||
                "N/A"
            ) +

            "\n\nCode:\n" +
            (
                error.code ||
                "N/A"
            ) +

            "\n\nDetails:\n" +
            (
                error.details ||
                "N/A"
            ) +

            "\n\nHint:\n" +
            (
                error.hint ||
                "N/A"
            )

        );


        return;
    }


    /* -----------------------------------------
       SUCCESS
    ----------------------------------------- */

    console.log(
        "STEP 9 - RPC RESPONSE:",
        data
    );


    if (
        data &&
        data.success === true
    ) {

        alert(
            "🎉 PAYMENT APPROVED!\n\n" +
            "Student को course access मिल गया है."
        );


        await loadPayments();


        return;
    }


    /* -----------------------------------------
       UNKNOWN RESPONSE
    ----------------------------------------- */

    alert(

        "⚠️ RPC चला लेकिन success response नहीं मिला.\n\n" +

        "Database Response:\n" +

        JSON.stringify(
            data,
            null,
            2
        )

    );
}


/* =================================================
   REJECT PAYMENT
================================================= */

async function rejectPayment(id) {

    const payment =
        allPayments.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if (!payment) {

        alert(
            "❌ Payment request नहीं मिली."
        );

        return;
    }


    const confirmReject =
        window.confirm(

            "Payment reject करें?\n\n" +

            "Student: " +
            payment.studentName +

            "\nCourse: " +
            payment.courseName +

            "\nUTR: " +
            payment.utr_number

        );


    if (!confirmReject) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .rpc(
                "reject_payment_request",
                {
                    request_id:
                        Number(id),

                    note_text:
                        "Payment verification failed."
                }
            );


    console.log(
        "REJECT DATA:",
        data
    );


    console.log(
        "REJECT ERROR:",
        error
    );


    if (error) {

        alert(

            "❌ Rejection failed!\n\n" +

            "Message: " +
            (
                error.message ||
                "N/A"
            ) +

            "\n\nCode: " +
            (
                error.code ||
                "N/A"
            ) +

            "\n\nDetails: " +
            (
                error.details ||
                "N/A"
            )

        );

        return;
    }


    if (
        data &&
        data.success === true
    ) {

        alert(
            "❌ Payment request rejected."
        );


        await loadPayments();

    } else {

        alert(
            "⚠️ Unexpected response:\n\n" +
            JSON.stringify(
                data,
                null,
                2
            )
        );
    }
}


/* ===============================
   ESCAPE HTML
================================ */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* ===============================
   START
================================ */

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        console.log(
            "Payment Requests page started."
        );


        const isAdmin =
            await checkAdmin();


        if (!isAdmin) {
            return;
        }


        await loadPayments();

    }
);

</script>
