<header class="header">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://xysgwtnclxpacmlgnmer.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_5VnfiKCfqI0s_dTO3B5CPg_OekspHI5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   GLOBAL VARIABLES
========================================== */

let testId = null;

let testData = null;

let questions = [];

let timerInterval = null;

let remainingSeconds = 0;

let submitted = false;

let currentUser = null;

let accessData = null;


/* ==========================================
   GET TEST ID
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


testId =
    params.get("test_id");


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================
   SHOW ERROR
========================================== */

function showError(
    title,
    message
) {

    clearInterval(
        timerInterval
    );


    document.getElementById(
        "timer"
    ).textContent =
        "ERROR";


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="error">

            <h3>
                ${escapeHtml(title)}
            </h3>

            <p>
                ${escapeHtml(message)}
            </p>

            <a
                href="student-tests.html"
                class="back-btn"
            >
                ← Back to Tests
            </a>

        </div>

    `;

}


/* ==========================================
   CHECK LOGIN
========================================== */

async function checkLogin() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getUser();


        if (error) {

            console.error(
                "Login Error:",
                error
            );


            window.location.href =
                "student-login.html";


            return false;

        }


        currentUser =
            data.user;


        if (!currentUser) {

            alert(
                "Please login first to start the test."
            );


            window.location.href =
                "student-login.html";


            return false;

        }


        console.log(
            "Logged-in Student ID:",
            currentUser.id
        );


        return true;

    }

    catch (error) {

        console.error(
            "Unexpected Login Error:",
            error
        );


        window.location.href =
            "student-login.html";


        return false;

    }

}


/* ==========================================
   CHECK TEST SERIES ACCESS
========================================== */

async function checkTestSeriesAccess(
    test
) {

    if (!currentUser) {

        return {

            allowed: false,

            reason:
                "Student login verify नहीं हुआ।"

        };

    }


    /*
       STEP 1:
       Matching course खोजें
    */

    const {
        data: courses,
        error: courseError
    } =
        await supabaseClient

            .from("courses")

            .select(`
                id,
                name,
                test_series_price,
                is_active
            `)

            .eq(
                "name",
                test.exam
            )

            .limit(1);


    if (courseError) {

        console.error(
            "Course lookup error:",
            courseError
        );


        return {

            allowed: false,

            reason:
                "Course information verify नहीं हो पाई।"

        };

    }


    const course =
        courses &&
        courses.length
            ? courses[0]
            : null;


    if (!course) {

        return {

            allowed: false,

            reason:
                "इस Test के लिए matching course नहीं मिला।"

        };

    }


    /*
       STEP 2:
       Course active होना चाहिए
    */

    if (
        course.is_active === false
    ) {

        return {

            allowed: false,

            reason:
                "यह exam currently active नहीं है।",

            course: course

        };

    }


    /*
       STEP 3:
       Test Series purchase check
    */

    const {
        data: enrollments,
        error: enrollmentError
    } =
        await supabaseClient

            .from("enrollments")

            .select(`
                id,
                student_id,
                course_id,
                purchase_type,
                amount,
                payment_status,
                created_at
            `)

            .eq(
                "student_id",
                currentUser.id
            )

            .eq(
                "course_id",
                course.id
            )

            .eq(
                "purchase_type",
                "test_series"
            )

            .eq(
                "payment_status",
                "paid"
            )

            .order(
                "created_at",
                {
                    ascending: false
                }
            )

            .limit(1);


    if (enrollmentError) {

        console.error(
            "Test Series enrollment error:",
            enrollmentError
        );


        return {

            allowed: false,

            reason:
                "Test Series purchase verify नहीं हो पाई।",

            course: course

        };

    }


    const enrollment =
        enrollments &&
        enrollments.length
            ? enrollments[0]
            : null;


    if (!enrollment) {

        return {

            allowed: false,

            reason:
                "इस exam की Test Series अभी आपके account में purchased नहीं है।",

            course: course

        };

    }


    return {

        allowed: true,

        course: course,

        enrollment: enrollment

    };

}


/* ==========================================
   SHOW ACCESS DENIED
========================================== */

function showTestSeriesLocked(
    test,
    access
) {

    clearInterval(
        timerInterval
    );


    document.getElementById(
        "timer"
    ).textContent =
        "LOCKED";


    const courseName =
        access.course
            ? access.course.name
            : test.exam;


    const price =
        access.course
            ? access.course.test_series_price
            : null;


    let priceText =
        "Test Series";


    if (
        price !== null &&
        price !== undefined &&
        price !== ""
    ) {

        const number =
            Number(price);


        if (
            !Number.isNaN(number)
        ) {

            priceText =
                number === 0
                    ? "Free"
                    : "₹" +
                      number.toLocaleString(
                          "en-IN"
                      );

        }

    }


    const courseId =
        access.course
            ? access.course.id
            : "";


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="access-lock">

            <div class="access-lock-icon">
                🔒
            </div>


            <h2>
                Test Series Required
            </h2>


            <div class="course-name-lock">
                📚 ${escapeHtml(courseName)}
            </div>


            <p>

                <strong>
                    ${escapeHtml(test.name)}
                </strong>

                शुरू करने के लिए
                इस exam की Full Test Series
                purchase होना जरूरी है।

                <br><br>

                सिर्फ Course / Notes खरीदने से
                Test Series automatically unlock नहीं होगी।

            </p>


            <p>

                📝 Full Test Series Price:
                <strong>
                    ${escapeHtml(priceText)}
                </strong>

            </p>


            <a
                href="student-courses.html?course_id=${encodeURIComponent(
                    courseId
                )}#tests"
                class="buy-series-btn"
            >
                📝 Buy Full Test Series
            </a>


            <a
                href="student-tests.html"
                class="tests-btn"
            >
                ← Back to Tests
            </a>

        </div>

    `;

}


/* ==========================================
   LOAD TEST
========================================== */

async function loadTest() {

    if (!testId) {

        showError(
            "Test ID नहीं मिला",
            "कृपया My Tests से Start Test करें।"
        );


        return;

    }


    /*
       STEP 1:
       Test information
    */

    const testResult =
        await supabaseClient

            .from("tests")

            .select(`
                id,
                exam,
                name,
                question_count,
                time_limit,
                price,
                status,
                description
            `)

            .eq(
                "id",
                testId
            )

            .single();


    if (testResult.error) {

        console.error(
            "Test load error:",
            testResult.error
        );


        showError(
            "Test load नहीं हुआ",
            testResult.error.message
        );


        return;

    }


    testData =
        testResult.data;


    if (!testData) {

        showError(
            "Test नहीं मिला",
            "यह Test उपलब्ध नहीं है।"
        );


        return;

    }


    /*
       STEP 2:
       Test active है या नहीं
    */

    if (
        String(
            testData.status || ""
        ).toLowerCase() !==
        "active"
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="error">

                <h3>
                    🔒 Test Currently Unavailable
                </h3>

                <p>
                    यह test अभी active नहीं है।
                </p>

                <a
                    href="student-tests.html"
                    class="back-btn"
                >
                    ← Back to Tests
                </a>

            </div>

        `;


        return;

    }


    /*
       STEP 3:
       Test Series purchase check
    */

    accessData =
        await checkTestSeriesAccess(
            testData
        );


    if (!accessData.allowed) {

        showTestSeriesLocked(
            testData,
            accessData
        );


        return;

    }


    /*
       STEP 4:
       QUESTIONS LOAD

       IMPORTANT SECURITY CHANGE:
       correct_option अब SELECT नहीं होगा.
    */

    const questionResult =
        await supabaseClient

            .from("mcqs")

            .select(`
                id,
                question,
                option_a,
                option_b,
                option_c,
                option_d
            `)

            .eq(
                "test_id",
                testId
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            );


    if (questionResult.error) {

        console.error(
            "Questions load error:",
            questionResult.error
        );


        showError(
            "Questions load नहीं हुए",
            questionResult.error.message
        );


        return;

    }


    questions =
        questionResult.data || [];


    if (
        questions.length === 0
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                <h3>
                    इस Test में अभी कोई question नहीं है।
                </h3>

                <p>

                    Admin Panel →
                    Manage MCQs में जाकर
                    इस Test से MCQs connect करें।

                </p>


                <a
                    href="student-tests.html"
                    class="back-btn"
                >
                    ← Back to Tests
                </a>

            </div>

        `;


        return;

    }


    /*
       STEP 5:
       Render
    */

    renderTest();


    /*
       STEP 6:
       Timer
    */

    remainingSeconds =
        Math.max(
            1,
            Number(
                testData.time_limit || 60
            )
        ) * 60;


    startTimer();

}


/* ==========================================
   RENDER TEST
========================================== */

function renderTest() {

    let html = `

        <div class="test-info">

            <h2>
                ${escapeHtml(
                    testData.name
                )}
            </h2>


            <div class="test-meta">

                <span>
                    📚 ${escapeHtml(
                        testData.exam
                    )}
                </span>


                <span>
                    ❓ ${questions.length} Questions
                </span>


                <span>
                    ⏱️ ${escapeHtml(
                        testData.time_limit
                    )} Minutes
                </span>


                <span>
                    🏆 ${questions.length} Marks
                </span>

            </div>


            <div class="negative-marking">

                ⚠️ Negative Marking:
                गलत उत्तर पर 1/3 अंक काटे जाएंगे।

            </div>

        </div>

    `;


    questions.forEach(
        (q, index) => {

            html += `

                <div class="question-card">

                    <div class="question-number">
                        Question ${index + 1}
                    </div>


                    <div class="question-text">
                        ${escapeHtml(
                            q.question
                        )}
                    </div>


                    <label class="option">

                        <input
                            type="radio"
                            name="question_${escapeHtml(q.id)}"
                            value="A"
                        >

                        <strong>A.</strong>

                        ${escapeHtml(
                            q.option_a
                        )}

                    </label>


                    <label class="option">

                        <input
                            type="radio"
                            name="question_${escapeHtml(q.id)}"
                            value="B"
                        >

                        <strong>B.</strong>

                        ${escapeHtml(
                            q.option_b
                        )}

                    </label>


                    <label class="option">

                        <input
                            type="radio"
                            name="question_${escapeHtml(q.id)}"
                            value="C"
                        >

                        <strong>C.</strong>

                        ${escapeHtml(
                            q.option_c
                        )}

                    </label>


                    <label class="option">

                        <input
                            type="radio"
                            name="question_${escapeHtml(q.id)}"
                            value="D"
                        >

                        <strong>D.</strong>

                        ${escapeHtml(
                            q.option_d
                        )}

                    </label>

                </div>

            `;

        }
    );


    html += `

        <div class="submit-area">

            <p>

                सही उत्तर के लिए +1
                और गलत उत्तर के लिए −1/3 अंक।

            </p>


            <button
                id="submitTestButton"
                class="submit-btn"
                onclick="submitTest()"
            >

                ✅ Submit Test

            </button>

        </div>

    `;


    document.getElementById(
        "content"
    ).innerHTML =
        html;

}


/* ==========================================
   TIMER
========================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    updateTimer();


    timerInterval =
        setInterval(
            () => {

                remainingSeconds--;


                updateTimer();


                if (
                    remainingSeconds <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    alert(
                        "⏰ Time समाप्त हो गया। Test automatically submit होगा।"
                    );


                    submitTest(
                        true
                    );

                }

            },
            1000
        );

}


/* ==========================================
   UPDATE TIMER
========================================== */

function updateTimer() {

    const minutes =
        Math.floor(
            remainingSeconds / 60
        );


    const seconds =
        remainingSeconds % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(
            minutes
        ).padStart(
            2,
            "0"
        )

        +

        ":"

        +

        String(
            seconds
        ).padStart(
            2,
            "0"
        );

}


/* ==========================================
   RECHECK ACCESS BEFORE SUBMIT
========================================== */

async function verifyAccessBeforeSubmit() {

    if (
        !currentUser ||
        !testData
    ) {

        return false;

    }


    const latestAccess =
        await checkTestSeriesAccess(
            testData
        );


    if (!latestAccess.allowed) {

        clearInterval(
            timerInterval
        );


        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="access-lock">

                <div class="access-lock-icon">
                    🔒
                </div>


                <h2>
                    Test Series Access Required
                </h2>


                <p>
                    आपका Test Series access
                    verify नहीं हो पाया।
                </p>


                <a
                    href="student-tests.html"
                    class="tests-btn"
                >
                    ← Back to Tests
                </a>

            </div>

        `;


        return false;

    }


    accessData =
        latestAccess;


    return true;

}


/* ==========================================
   COLLECT ANSWERS
========================================== */

function collectAnswers() {

    const answers = {};


    questions.forEach(
        q => {

            const selected =
                document.querySelector(
                    `input[name="question_${q.id}"]:checked`
                );


            if (selected) {

                answers[
                    String(q.id)
                ] =
                    selected.value;

            }

        }
    );


    return answers;

}


/* ==========================================
   SUBMIT TEST - SECURE
========================================== */

async function submitTest(
    autoSubmit = false
) {

    if (submitted) {

        return;

    }


    if (!currentUser) {

        alert(
            "Login session नहीं मिली। कृपया दोबारा login करें।"
        );


        window.location.href =
            "student-login.html";


        return;

    }


    if (
        !questions ||
        questions.length === 0
    ) {

        alert(
            "Questions उपलब्ध नहीं हैं।"
        );


        return;

    }


    if (!autoSubmit) {

        const confirmSubmit =
            confirm(
                "क्या आप Test submit करना चाहते हैं?"
            );


        if (!confirmSubmit) {

            return;

        }

    }


    /*
       Submit से पहले access re-check
    */

    const stillAllowed =
        await verifyAccessBeforeSubmit();


    if (!stillAllowed) {

        return;

    }


    submitted = true;


    clearInterval(
        timerInterval
    );


    const submitButton =
        document.getElementById(
            "submitTestButton"
        );


    if (submitButton) {

        submitButton.disabled =
            true;


        submitButton.textContent =
            "⏳ Checking Answers...";

    }


    /*
       Student के selected answers
       केवल यही database को भेजे जाएँगे.

       Correct answers browser में
       मौजूद ही नहीं हैं.
    */

    const answers =
        collectAnswers();


    /*
       SECURE DATABASE GRADING

       Database function:
       submit_test_secure(
           test_id,
           answers
       )
    */

    const {
        data: result,
        error
    } =
        await supabaseClient

            .rpc(
                "submit_test_secure",
                {
                    p_test_id:
                        Number(testId),

                    p_answers:
                        answers
                }
            );


    if (error) {

        console.error(
            "Secure test submission error:",
            error
        );


        submitted = false;


        if (submitButton) {

            submitButton.disabled =
                false;


            submitButton.textContent =
                "✅ Submit Test";

        }


        alert(
            "Test submit नहीं हुआ:\n" +
            error.message
        );


        return;

    }


    if (
        !result ||
        result.success !== true
    ) {

        console.error(
            "Invalid secure result:",
            result
        );


        submitted = false;


        if (submitButton) {

            submitButton.disabled =
                false;


            submitButton.textContent =
                "✅ Submit Test";

        }


        alert(
            "Test result verify नहीं हो पाया।"
        );


        return;

    }


    /*
       Server से मिले हुए final result
    */

    showResult(

        Number(
            result.score || 0
        ),

        Number(
            result.total_marks || questions.length
        ),

        Number(
            result.percentage || 0
        ),

        Number(
            result.correct || 0
        ) +

        Number(
            result.wrong || 0
        ),

        Number(
            result.correct || 0
        ),

        Number(
            result.wrong || 0
        ),

        Number(
            result.unattempted || 0
        )

    );

}


/* ==========================================
   RESULT
========================================== */

function showResult(
    score,
    totalMarks,
    percentage,
    attempted,
    correctCount,
    wrongCount,
    unattemptedCount
) {

    document.getElementById(
        "timer"
    ).textContent =
        "DONE";


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="result-box">

            <h2>
                🎉 Test Submitted Successfully!
            </h2>


            <div class="score">

                ${Number(score).toFixed(2)}
                /
                ${totalMarks}

            </div>


            <div class="result-details">

                <div class="result-row">

                    <span>
                        ✅ Correct
                    </span>

                    <strong>
                        ${correctCount}
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        ❌ Wrong
                    </span>

                    <strong class="negative-result">
                        ${wrongCount}
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        ⭕ Unattempted
                    </span>

                    <strong>
                        ${unattemptedCount}
                    </strong>

                </div>


                <div class="result-row">

                    <span>
                        📊 Percentage
                    </span>

                    <strong>
                        ${Number(
                            percentage
                        ).toFixed(2)}%
                    </strong>

                </div>

            </div>


            <p>

                सही उत्तर: +1 अंक

                <br>

                गलत उत्तर: −1/3 अंक

                <br>

                छोड़ा हुआ: 0 अंक

            </p>


            <a
                href="student-results.html"
                class="back-btn"
            >
                📊 View My Results
            </a>


            <br>


            <a
                href="student-tests.html"
                class="back-btn"
            >
                ← Back to Tests
            </a>

        </div>

    `;

}


/* ==========================================
   START PAGE
========================================== */

async function startPage() {

    /*
       1. Login check
    */

    const loggedIn =
        await checkLogin();


    if (!loggedIn) {

        return;

    }


    /*
       2. Test + Test Series access check
    */

    await loadTest();

}


/* ==========================================
   START
========================================== */

startPage();
