<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#052a5b">

    <title>Student Login | RajEdge</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .login-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px 14px;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(245,196,0,.18),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #eef4ff 0%,
                    #f8fafc 52%,
                    #fff9df 100%
                );
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            background: rgba(255,255,255,.97);

            border: 1px solid rgba(5,42,91,.08);

            border-radius: 26px;

            padding: 30px 24px 24px;

            box-shadow:
                0 18px 55px rgba(5,42,91,.13);
        }

        /* =========================
           LOGO
        ========================= */

        .login-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-logo-icon {
            width: 68px;
            height: 68px;

            margin: 0 auto 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #052a5b,
                    #0b4b88
                );

            box-shadow:
                0 10px 25px rgba(5,42,91,.20);

            font-size: 34px;
        }

        .login-logo h1 {
            margin: 0;

            color: #052a5b;

            font-size: 31px;

            letter-spacing: -.5px;
        }

        .login-logo h1 span {
            color: #f5c400;
        }

        .login-logo p {
            margin: 6px 0 0;

            color: #718096;

            font-size: 13px;
        }

        /* =========================
           TITLE
        ========================= */

        .login-title {
            text-align: center;

            margin: 0 0 20px;

            color: #052a5b;

            font-size: 23px;
        }

        .login-subtitle {
            text-align: center;

            margin: -10px 0 20px;

            color: #7b8798;

            font-size: 13px;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;

            margin-bottom: 16px;

            padding: 12px 13px;

            border-radius: 12px;

            text-align: center;

            font-size: 13px;

            line-height: 1.45;

            font-weight: 600;
        }

        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 700;

            color: #26364d;

            font-size: 14px;
        }

        .form-group input {
            width: 100%;

            min-height: 52px;

            padding: 13px 15px;

            border:
                1px solid #d9e0ea;

            border-radius: 13px;

            background: #fbfcfe;

            color: #172033;

            font-size: 16px;

            outline: none;

            transition: .2s ease;
        }

        .form-group input:focus {
            background: #fff;

            border-color: #0b4b88;

            box-shadow:
                0 0 0 4px
                rgba(11,75,136,.08);
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;

            min-height: 54px;

            margin-top: 5px;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #052a5b,
                    #0b4b88
                );

            color: #fff;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(5,42,91,.20);

            transition:
                transform .15s ease,
                opacity .15s ease;
        }

        .login-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #0b4b88,
                    #052a5b
                );
        }

        .login-btn:active {
            transform: scale(.985);
        }

        .login-btn:disabled {
            opacity: .65;

            cursor: not-allowed;

            box-shadow: none;
        }

        /* =========================
           REGISTER
        ========================= */

        .register-text {
            text-align: center;

            margin-top: 20px;

            color: #68778d;

            font-size: 14px;
        }

        .register-text a {
            color: #0b4b88;

            font-weight: 800;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* =========================
           BACK HOME
        ========================= */

        .back-home {
            display: block;

            text-align: center;

            margin-top: 16px;

            color: #7b8798;

            text-decoration: none;

            font-size: 13px;
        }

        .back-home:hover {
            color: #0b4b88;
        }

        /* =========================
           SECURITY
        ========================= */

        .security-note {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            margin-top: 18px;

            color: #7b8798;

            font-size: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .login-page {
                align-items: flex-start;

                padding:
                    18px 12px;
            }

            .login-card {
                margin-top: 10px;

                padding:
                    27px 18px 21px;

                border-radius: 22px;
            }

            .login-logo {
                margin-bottom: 21px;
            }

            .login-logo-icon {
                width: 62px;
                height: 62px;

                font-size: 31px;
            }

            .login-logo h1 {
                font-size: 29px;
            }

            .login-title {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <!-- LOGO -->

        <div class="login-logo">

            <div class="login-logo-icon">
                📚
            </div>

            <h1>
                Raj<span>Edge</span>
            </h1>

            <p>
                Rajasthan Education Hub
            </p>

        </div>


        <!-- TITLE -->

        <h2 class="login-title">
            Student Login
        </h2>

        <p class="login-subtitle">
            Apne registered mobile number se login karein
        </p>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- LOGIN FORM -->

        <form
            id="loginForm"
            autocomplete="on"
        >

            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="username"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    minlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    pattern="[0-9]{10}"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <!-- REGISTER -->

        <div class="register-text">

            New Student?

            <a href="student-register.html">
                Register Now
            </a>

        </div>


        <!-- HOME -->

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>


        <!-- SECURITY -->

        <div class="security-note">
            🔒 Secure login powered by RajEdge
        </div>

    </div>

</div>


<script>

/* ==========================================
   SUPABASE CONFIG
========================================== */

const SUPABASE_URL =
    "https://xysgwtnclxpacmlgnmer.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5VnFiKCfqI0s_dTO3B5CPg_OekspHI5";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   MESSAGE FUNCTION
========================================== */

function showMessage(
    message,
    success = false
) {

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    if (success) {

        box.style.background =
            "#e8f7ee";

        box.style.color =
            "#16753b";

    } else {

        box.style.background =
            "#fdecec";

        box.style.color =
            "#b42318";
    }

}


/* ==========================================
   LOGIN FORM
========================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            /* ===============================
               FORM VALUES
            =============================== */

            const mobile =
                document
                    .getElementById("mobile")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const loginBtn =
                document
                    .getElementById("loginBtn");


            /* ===============================
               MOBILE VALIDATION
            =============================== */

            if (
                !/^[0-9]{10}$/.test(
                    mobile
                )
            ) {

                showMessage(
                    "Please enter a valid 10 digit mobile number."
                );

                return;
            }


            /* ===============================
               PASSWORD VALIDATION
            =============================== */

            if (!password) {

                showMessage(
                    "Please enter your password."
                );

                return;
            }


            /* ===============================
               LOADING
            =============================== */

            loginBtn.disabled =
                true;

            loginBtn.textContent =
                "Logging in...";


            try {


                /* ==========================================
                   STEP 1
                   MOBILE → LOGIN EMAIL
                ========================================== */

                const {
                    data: profileData,
                    error: profileError
                } =
                    await supabaseClient.rpc(
                        "get_student_login_email",
                        {
                            p_mobile: mobile
                        }
                    );


                /* ===============================
                   RPC ERROR
                =============================== */

                if (profileError) {

                    console.error(
                        "Profile RPC Error:",
                        profileError
                    );

                    throw profileError;

                }


                /* ===============================
                   FIND PROFILE
                =============================== */

                const profile =
                    profileData &&
                    profileData.length > 0
                        ? profileData[0]
                        : null;


                /* ===============================
                   MOBILE NOT FOUND
                =============================== */

                if (!profile) {

                    showMessage(
                        "This mobile number is not registered."
                    );

                    return;
                }


                /* ==========================================
                   STEP 2
                   GET LOGIN EMAIL
                ========================================== */

                const email =
                    profile.login_email ||
                    profile.email;


                if (!email) {

                    showMessage(
                        "Login email not found for this account."
                    );

                    return;
                }


                /* ==========================================
                   STEP 3
                   SUPABASE AUTH LOGIN
                ========================================== */

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .signInWithPassword({

                            email:
                                email,

                            password:
                                password

                        });


                /* ===============================
                   AUTH ERROR
                =============================== */

                if (error) {

                    console.error(
                        "Auth Login Error:",
                        error
                    );

                    throw error;

                }


                /* ===============================
                   USER CHECK
                =============================== */

                if (
                    !data ||
                    !data.user
                ) {

                    showMessage(
                        "Login failed. Please try again."
                    );

                    return;
                }


                /* ==========================================
                   LOGIN SUCCESS
                ========================================== */

                showMessage(
                    "✅ Login successful! Redirecting...",
                    true
                );


                /* ===============================
                   REDIRECT
                =============================== */

                setTimeout(
                    function() {

                        window.location.href =
                            "student-dashboard.html";

                    },
                    800
                );


            } catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                let message =
                    error.message ||
                    "Login failed. Please try again.";


                const lowerMessage =
                    message.toLowerCase();


                /* ===============================
                   FRIENDLY ERRORS
                =============================== */

                if (
                    lowerMessage.includes(
                        "invalid login credentials"
                    ) ||
                    lowerMessage.includes(
                        "invalid_credentials"
                    )
                ) {

                    message =
                        "❌ Mobile number या password गलत है.";

                }

                else if (
                    lowerMessage.includes(
                        "email not confirmed"
                    )
                ) {

                    message =
                        "❌ Email verification pending है. पहले account verify करें.";

                }

                else if (
                    lowerMessage.includes(
                        "too many requests"
                    )
                ) {

                    message =
                        "⏳ बहुत ज्यादा login attempts हैं. थोड़ी देर बाद फिर कोशिश करें.";

                }


                showMessage(
                    message
                );

            }

            finally {

                /* ===============================
                   RESET BUTTON
                =============================== */

                loginBtn.disabled =
                    false;

                loginBtn.textContent =
                    "Login";

            }

        }
    );

</script>

</body>
</html>
