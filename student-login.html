<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062b55">
<title>RajEdge - Login</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
    background:#f4f8fc;
    color:#12304d;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.card{
    width:min(430px,100%);
    background:#fff;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(4,38,73,.15);
}

.hero{
    background:linear-gradient(150deg,#062b55,#0b6680);
    padding:34px 28px 30px;
    color:#fff;
    text-align:center;
    position:relative;
}

.hero:after{
    content:"";
    position:absolute;
    right:-55px;
    top:-55px;
    width:170px;
    height:170px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
}

.logo{
    width:72px;
    height:72px;
    margin:auto;
    border-radius:22px;
    background:#fff;
    color:#062b55;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:35px;
    box-shadow:0 8px 22px rgba(0,0,0,.15);
    position:relative;
    z-index:1;
}

.brand{
    font-size:30px;
    font-weight:900;
    margin-top:12px;
}

.brand span{
    color:#f6b73c;
}

.sub{
    font-size:13px;
    opacity:.9;
    margin-top:3px;
}

.body{
    padding:26px;
}

.eyebrow{
    font-size:12px;
    color:#0b7184;
    font-weight:800;
    letter-spacing:.7px;
    text-transform:uppercase;
}

.title{
    font-size:25px;
    font-weight:850;
    margin:5px 0;
}

.desc{
    font-size:13px;
    color:#6c7c8c;
    margin-bottom:22px;
}

.group{
    margin-bottom:15px;
}

.label{
    display:block;
    font-size:13px;
    font-weight:750;
    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

.input{
    width:100%;
    height:52px;
    border:1px solid #d9e4ed;
    border-radius:14px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    background:#fbfdff;
    transition:.2s;
}

.input:focus{
    border-color:#0b7184;
    box-shadow:0 0 0 4px rgba(11,113,132,.09);
    background:#fff;
}

.toggle{
    position:absolute;
    right:8px;
    top:7px;
    height:38px;
    border:0;
    background:transparent;
    padding:0 10px;
    color:#5f7385;
    font-size:18px;
    cursor:pointer;
}

.forgot{
    display:block;
    text-align:right;
    color:#086c82;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    margin:-3px 0 18px;
}

.login-btn{
    width:100%;
    height:53px;
    border:0;
    border-radius:15px;
    background:linear-gradient(90deg,#062b55,#08768a);
    color:#fff;
    font-size:16px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(6,43,85,.2);
}

.login-btn:disabled{
    opacity:.65;
    cursor:wait;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:#91a0ae;
    font-size:12px;
    margin:20px 0;
}

.divider:before,
.divider:after{
    content:"";
    height:1px;
    background:#e4ebf1;
    flex:1;
}

.secondary{
    width:100%;
    height:49px;
    border:1px solid #dbe5ed;
    border-radius:14px;
    background:#fff;
    color:#163b5a;
    font-weight:800;
    cursor:pointer;
}

.register{
    text-align:center;
    font-size:13px;
    color:#687887;
    margin-top:20px;
}

.register a{
    color:#086c82;
    font-weight:850;
    text-decoration:none;
}

.message{
    display:none;
    margin:0 0 16px;
    padding:12px 14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.45;
}

.success{
    display:block;
    background:#eafaf3;
    color:#13734c;
}

.error{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

.secure{
    text-align:center;
    font-size:11px;
    color:#8a98a5;
    margin-top:18px;
}

.back{
    text-align:center;
    margin-top:14px;
}

.back a{
    font-size:12px;
    color:#718292;
    text-decoration:none;
}

@media(max-width:420px){
    .page{
        padding:0;
    }

    .card{
        min-height:100vh;
        border-radius:0;
    }

    .hero{
        padding-top:42px;
    }

    .body{
        padding:24px 20px;
    }
}
</style>
</head>

<body>

<div class="page">
<div class="card">

<section class="hero">

<div class="logo">R</div>

<div class="brand">
Raj<span>Edge</span>
</div>

<div class="sub">
Rajasthan Exam Preparation
</div>

</section>


<section class="body">

<div class="eyebrow">
Student Login
</div>

<div class="title">
Welcome back, Warrior! 👋
</div>

<div class="desc">
अपनी preparation वहीं से शुरू करें जहाँ आपने छोड़ी थी।
</div>


<div id="message" class="message"></div>


<form id="loginForm">

<div class="group">

<label class="label" for="mobile">
📱 Mobile Number
</label>

<input
class="input"
id="mobile"
inputmode="numeric"
maxlength="10"
autocomplete="tel"
placeholder="10 digit mobile number"
required
>

</div>


<div class="group">

<label class="label" for="password">
🔐 Password
</label>

<div class="input-wrap">

<input
class="input"
id="password"
type="password"
autocomplete="current-password"
placeholder="Enter your password"
required
>

<button
class="toggle"
type="button"
id="togglePassword"
aria-label="Show password"
>
👁️
</button>

</div>

</div>


<a
class="forgot"
href="#"
id="forgotBtn"
>
Forgot Password?
</a>


<button
class="login-btn"
id="loginBtn"
type="submit"
>
Login
</button>

</form>


<div class="divider">
OR
</div>


<button
class="secondary"
type="button"
onclick="location.href='student-register.html'"
>
Create New Account
</button>


<div class="register">
Don't have an account?
<a href="student-register.html">
Sign Up
</a>
</div>


<div class="secure">
🔒 Secure login powered by RajEdge + Supabase
</div>


<div class="back">
<a href="index.html">
← Back to RajEdge Home
</a>
</div>

</section>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ================================
   SUPABASE CONFIG
================================ */

const SUPABASE_URL =
"https://xysgwtnclxpacmlgnmer.supabase.co";

const SUPABASE_KEY =
"sb_publishable_5VnfiKCfqI0s_dTO3B5CPg_OekspHI5";


/* ================================
   SUPABASE CLIENT
   IMPORTANT:
   No custom storageKey
================================ */

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   DOM
================================ */

const form =
document.getElementById("loginForm");

const btn =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


/* ================================
   MESSAGE
================================ */

function showMessage(
    text,
    type = "error"
){
    message.textContent = text;
    message.className =
        "message " + type;
}


/* ================================
   PASSWORD SHOW / HIDE
================================ */

document
.getElementById("togglePassword")
.addEventListener("click", function(){

    const password =
        document.getElementById("password");

    if(password.type === "password"){

        password.type = "text";
        this.textContent = "🙈";

    }else{

        password.type = "password";
        this.textContent = "👁️";

    }

});


/* ================================
   MOBILE VALIDATION
================================ */

document
.getElementById("mobile")
.addEventListener("input", function(e){

    e.target.value =
        e.target.value
        .replace(/\D/g,"")
        .slice(0,10);

});


/* ================================
   FORGOT PASSWORD
================================ */

document
.getElementById("forgotBtn")
.addEventListener("click", function(e){

    e.preventDefault();

    showMessage(
        "Password reset के लिए अभी admin/support से संपर्क करें।",
        "error"
    );

});


/* ================================
   EXISTING SESSION CHECK
================================ */

(async function(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();

        if(error){

            console.error(
                "Session Check Error:",
                error
            );

            return;
        }

        if(
            data &&
            data.session &&
            data.session.user
        ){

            console.log(
                "Existing student session found."
            );

            window.location.replace(
                "student-dashboard.html"
            );

        }

    }catch(error){

        console.error(
            "Session Check Failed:",
            error
        );

    }

})();


/* ================================
   LOGIN
================================ */

form.addEventListener(
"submit",
async function(e){

    e.preventDefault();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    /* Mobile validation */

    if(
        !/^[6-9]\d{9}$/.test(mobile)
    ){

        showMessage(
            "कृपया valid 10 digit mobile number डालें।"
        );

        return;

    }


    /* Password validation */

    if(password.length < 6){

        showMessage(
            "Password कम से कम 6 characters का होना चाहिए।"
        );

        return;

    }


    /* Button loading */

    btn.disabled = true;
    btn.textContent = "Signing in...";

    message.className = "message";


    try{

        /* ==========================
           GET STUDENT LOGIN EMAIL
        ========================== */

        const {
            data: profile,
            error: rpcError
        } =
        await supabaseClient.rpc(
            "get_student_login_email",
            {
                p_mobile: mobile
            }
        );


        if(rpcError){

            console.error(
                "RPC Error:",
                rpcError
            );

            throw rpcError;

        }


        const row =
            Array.isArray(profile)
            ? profile[0]
            : profile;


        if(!row){

            throw new Error(
                "इस mobile number से student account नहीं मिला। पहले Sign Up करें।"
            );

        }


        /* Email */

        const email =
            (
                row.login_email ||
                row.email ||
                ""
            )
            .trim();


        if(!email){

            throw new Error(
                "Student login email profile में उपलब्ध नहीं है।"
            );

        }


        console.log(
            "Login email found:",
            email
        );


        /* ==========================
           SUPABASE LOGIN
        ========================== */

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({
            email: email,
            password: password
        });


        if(error){

            console.error(
                "Supabase Login Error:",
                error
            );

            throw error;

        }


        if(
            !data ||
            !data.session ||
            !data.session.user
        ){

            throw new Error(
                "Login session create नहीं हुई। कृपया दोबारा try करें।"
            );

        }


        /* ==========================
           SUCCESS
        ========================== */

        showMessage(
            "✅ Login successful! Dashboard खोल रहे हैं...",
            "success"
        );


        btn.textContent =
            "Opening Dashboard...";


        /*
         * Small delay so user can see
         * successful login message.
         */

        await new Promise(
            resolve =>
            setTimeout(resolve,700)
        );


        window.location.replace(
            "student-dashboard.html"
        );


    }catch(error){

        console.error(
            "RajEdge Login Error:",
            error
        );


        let errorMessage =
            error?.message ||
            "Login failed.";


        if(
            /invalid login credentials/i
            .test(errorMessage)
        ){

            errorMessage =
                "Mobile number या password गलत है.";

        }


        if(
            /email not confirmed/i
            .test(errorMessage)
        ){

            errorMessage =
                "Account email confirmation pending है.";

        }


        if(
            /fetch|network/i
            .test(errorMessage)
        ){

            errorMessage =
                "Internet connection या Supabase connection check करें.";

        }


        showMessage(
            "❌ " + errorMessage,
            "error"
        );


    }finally{

        btn.disabled = false;
        btn.textContent = "Login";

    }

});

</script>

</body>
</html>
