<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062b55"><title>RajEdge - Create Account</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f8fc;color:#12304d}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(450px,100%);background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(4,38,73,.15)}.hero{background:linear-gradient(150deg,#062b55,#0b6680);padding:30px 28px;color:#fff;text-align:center}.logo{width:64px;height:64px;margin:auto;border-radius:20px;background:#fff;color:#062b55;display:grid;place-items:center;font-weight:900;font-size:32px}.brand{font-size:28px;font-weight:900;margin-top:10px}.brand span{color:#f6b73c}.sub{font-size:12px;opacity:.9}.body{padding:24px}.eyebrow{font-size:12px;color:#0b7184;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.title{font-size:24px;font-weight:850;margin:5px 0}.desc{font-size:13px;color:#6c7c8c;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.group{margin-bottom:13px}.label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.input,.select{width:100%;height:49px;border:1px solid #d9e4ed;border-radius:13px;padding:0 13px;font-size:15px;outline:none;background:#fbfdff}.input:focus,.select:focus{border-color:#0b7184;box-shadow:0 0 0 4px rgba(11,113,132,.09)}.select{appearance:auto}.btn{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(90deg,#062b55,#08768a);color:#fff;font-size:15px;font-weight:850;cursor:pointer;margin-top:5px}.btn:disabled{opacity:.65;cursor:wait}.message{display:none;margin:0 0 14px;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.45}.success{display:block;background:#eafaf3;color:#13734c}.error{display:block;background:#fff0f0;color:#b42318}.login{text-align:center;font-size:13px;color:#687887;margin-top:18px}.login a{color:#086c82;font-weight:850;text-decoration:none}.secure{text-align:center;font-size:11px;color:#8a98a5;margin-top:15px}@media(max-width:460px){.page{padding:0}.card{min-height:100vh;border-radius:0}.grid{grid-template-columns:1fr}.hero{padding-top:38px}}
</style></head><body><div class="page"><div class="card"><section class="hero"><div class="logo">R</div><div class="brand">Raj<span>Edge</span></div><div class="sub">Rajasthan Exam Preparation</div></section><section class="body"><div class="eyebrow">Student Registration</div><div class="title">Create Your Account 🚀</div><div class="desc">आज से अपनी Rajasthan exam preparation को organised बनाएं।</div><div id="message" class="message"></div><form id="registerForm"><div class="group"><label class="label">👤 Full Name</label><input class="input" id="name" placeholder="Your full name" autocomplete="name" required></div><div class="grid"><div class="group"><label class="label">📱 Mobile Number</label><input class="input" id="mobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile" autocomplete="tel" required></div><div class="group"><label class="label">🎯 Exam</label><select class="select" id="exam" required><option value="">Select exam</option><option>REET</option><option>CET</option><option>LDC</option><option>VDO</option><option>Lab Assistant</option><option>Rajasthan Police HC</option></select></div></div><div class="group"><label class="label">✉️ Email Address</label><input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" required></div><div class="grid"><div class="group"><label class="label">🔐 Password</label><input class="input" id="password" type="password" minlength="6" placeholder="Min 6 characters" autocomplete="new-password" required></div><div class="group"><label class="label">🔐 Confirm Password</label><input class="input" id="confirmPassword" type="password" minlength="6" placeholder="Repeat password" autocomplete="new-password" required></div></div><button class="btn" id="registerBtn" type="submit">Create Account</button></form><div class="login">Already have an account? <a href="student-login.html">Login</a></div><div class="secure">🔒 Your account is secured by Supabase Authentication</div></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://xysgwtnclxpacmlgnmer.supabase.co";const SUPABASE_KEY="sb_publishable_5VnFiKCfqI0s_dTO3B5CPg_OekspHI5";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'rajedge-student-auth'}});const form=document.getElementById('registerForm'),btn=document.getElementById('registerBtn'),msg=document.getElementById('message');function show(t,c='error'){msg.textContent=t;msg.className='message '+c}document.getElementById('mobile').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10));form.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),exam=document.getElementById('exam').value,password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;if(name.length<2)return show('कृपया अपना सही नाम दर्ज करें।');if(!/^[6-9]\d{9}$/.test(mobile))return show('कृपया valid 10 digit Indian mobile number दर्ज करें।');if(!exam)return show('कृपया अपना exam select करें।');if(password.length<6)return show('Password कम से कम 6 characters का होना चाहिए।');if(password!==confirm)return show('Password और Confirm Password समान नहीं हैं।');btn.disabled=true;btn.textContent='Creating Account...';msg.className='message';try{const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name,mobile,exam}}});if(error)throw error;if(!data?.user)throw new Error('Account create नहीं हो पाया।');show('✅ Account successfully created! अब Login करें।','success');form.reset();btn.textContent='Account Created';setTimeout(()=>location.replace('student-login.html'),1200)}catch(err){console.error('RajEdge Registration Error:',err);let m=err?.message||'Registration failed.';if(/user already registered/i.test(m))m='यह email पहले से registered है। कृपया Login करें।';show('❌ '+m);btn.disabled=false;btn.textContent='Create Account'}});
</script></body></html>
