<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | RajEdge</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .register-page {
            min-height: 100vh;
            background: #f5f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.10);
        }

        .register-logo {
            text-align: center;
            margin-bottom: 22px;
        }

        .register-logo-icon {
            font-size: 42px;
        }

        .register-logo h1 {
            margin: 5px 0;
            color: #052a5b;
            font-size: 30px;
        }

        .register-logo h1 span {
            color: #f5c400;
        }

        .register-logo p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .register-card h2 {
            text-align: center;
            color: #052a5b;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border: 1px solid #d8dee8;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #0b4b88;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #052a5b;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .register-btn:hover {
            background: #0b4b88;
        }

        .register-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 15px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #e8f7ee;
            color: #16803c;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            color: #b42318;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-text a {
            color: #0b4b88;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        @media(max-width: 500px) {
            .register-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="register-page">

    <div class="register-card">

        <!-- LOGO -->
        <div class="register-logo">

            <div class="register-logo-icon">
                📚
            </div>

            <h1>
                Raj<span>Edge</span>
            </h1>

            <p>
                Rajasthan Education Hub
            </p>

        </div>


        <h2>
            Create Student Account
        </h2>


        <!-- MESSAGE -->
        <div id="messageBox" class="message"></div>


        <!-- REGISTER FORM -->
        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="exam">
                    Select Exam
                </label>

                <select id="exam" required>

                    <option value="">
                        Select your exam
                    </option>

                    <option value="REET">
                        REET
                    </option>

                    <option value="CET">
                        CET
                    </option>

                    <option value="LDC">
                        LDC
                    </option>

                    <option value="VDO">
                        VDO
                    </option>

                    <option value="Lab Assistant">
                        Lab Assistant
                    </option>

                    <option value="Rajasthan Police HC">
                        Rajasthan Police HC
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="password">
                    Create Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-btn"
                id="registerBtn">
                Create Account
            </button>

        </form>


        <div class="login-text">

            Already have an account?

            <a href="student-login.html">
                Login
            </a>

        </div>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://xysgwtnclxpacmlgnmer.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_5VnfiKCfqI0s_dTO3B5CPg_OekspHI5";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const registerForm =
    document.getElementById("registerForm");

const registerBtn =
    document.getElementById("registerBtn");

const messageBox =
    document.getElementById("messageBox");


/* --------------------------------
   MESSAGE
-------------------------------- */

function showMessage(message, type) {

    messageBox.textContent = message;

    messageBox.className =
        "message " + type;

}


/* --------------------------------
   REGISTER
-------------------------------- */

registerForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const name =
            document.getElementById("name")
                .value.trim();


        const mobile =
            document.getElementById("mobile")
                .value.trim();


        const email =
            document.getElementById("email")
                .value.trim()
                .toLowerCase();


        const exam =
            document.getElementById("exam")
                .value;


        const password =
            document.getElementById("password")
                .value;


        const confirmPassword =
            document.getElementById("confirmPassword")
                .value;


        /* --------------------------------
           VALIDATION
        -------------------------------- */


        if (!name) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;
        }


        if (mobile.length !== 10) {

            showMessage(
                "Please enter a valid 10 digit mobile number.",
                "error"
            );

            return;
        }


        if (!/^[0-9]+$/.test(mobile)) {

            showMessage(
                "Mobile number में केवल digits होने चाहिए।",
                "error"
            );

            return;
        }


        if (!exam) {

            showMessage(
                "Please select your exam.",
                "error"
            );

            return;
        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "Password and Confirm Password do not match.",
                "error"
            );

            return;
        }


        /* --------------------------------
           BUTTON
        -------------------------------- */

        registerBtn.disabled = true;

        registerBtn.textContent =
            "Creating Account...";


        try {


            /* --------------------------------
               SUPABASE AUTH SIGNUP

               Profile database में manually
               insert नहीं होगा.

               Database trigger automatically
               student_profiles में row बनाएगा.
            -------------------------------- */


            const {
                data,
                error
            } = await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        full_name: name,

                        mobile: mobile,

                        exam: exam

                    }

                }

            });


            if (error) {

                throw error;

            }


            if (!data.user) {

                throw new Error(
                    "Account create नहीं हो पाया।"
                );

            }


            /* --------------------------------
               SUCCESS
            -------------------------------- */


            showMessage(
                "✅ Account successfully created! अब Login करें।",
                "success"
            );


            registerForm.reset();


            registerBtn.textContent =
                "Account Created";


            /*
             * Login page
             */

            setTimeout(
                function() {

                    window.location.href =
                        "student-login.html";

                },
                1500
            );


        } catch (error) {

            console.error(
                "Registration Error:",
                error
            );


            let message =
                error.message ||
                "Registration failed.";


            if (
                message
                    .toLowerCase()
                    .includes("user already registered")
            ) {

                message =
                    "यह email पहले से registered है। कृपया Login करें.";

            }


            showMessage(
                "❌ " + message,
                "error"
            );


            registerBtn.disabled = false;

            registerBtn.textContent =
                "Create Account";

        }

    });

</script>

</body>
</html>
